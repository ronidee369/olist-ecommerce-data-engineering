
version: 2

models:
  - name: int_orders
    description: "Intermediate model combining orders and customer information."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

  - name: int_order_items
    description: "Intermediate model combining order items, products, and sellers."
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: seller_id
        data_tests:
          - not_null

  - name: int_payments
    description: "Intermediate model combining payment and order information."
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: payment_sequential
        data_tests:
          - not_null

  - name: int_reviews
    description: "Intermediate model combining reviews and order information."
    columns:
      - name: review_id
        data_tests:
          - not_null

      - name: order_id
        data_tests:
          - not_null
